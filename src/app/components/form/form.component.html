<form [formGroup]="rsvpForm" (ngSubmit)="sendRsvp()">
  <h2>Formulario de confirmación</h2>

  <div class="form-group">
    <label>Nombre y Apellido</label>
    <input formControlName="nombre" />
  </div>

  <div class="form-group checkbox-group">
    <label>
      <input type="checkbox" formControlName="confirmacion" />
      Confirmo mi asistencia
    </label>
  </div>

  <div class="form-group">
    <label>Requisitos alimentarios</label>
    <select formControlName="alimentacion">
      <option value="">Seleccionar</option>
      <option value="ninguno">Ninguno</option>
      <option value="intolerancias">Intolerancias</option>
      <option value="alergias">Alergias</option>
    </select>
  </div>

  <div class="form-group">
    <textarea
      formControlName="comentariosAlimentacion"
      placeholder="Comentarios"
    ></textarea>
  </div>

  <div class="form-group">
    <label>Canción sugerida</label>
    <input formControlName="cancion" />
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" formControlName="mail" />
  </div>

  <button type="submit" [disabled]="enviando">
    {{ enviando ? 'Enviando...' : 'Enviar confirmación' }}
  </button>

</form>
